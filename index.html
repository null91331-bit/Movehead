<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baxış İstiqaməti</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 15px;
}

video {
    width: 100%;
    max-width: 700px;
    border-radius: 15px;
    transform: scaleX(-1);
    background: black;
}

#direction {
    font-size: 40px;
    font-weight: bold;
    margin: 20px;
}

#status {
    color: #bbb;
    font-size: 17px;
}

button {
    font-size: 20px;
    padding: 15px 25px;
    border: none;
    border-radius: 12px;
    margin: 15px;
}
</style>
</head>

<body>

<h1>👁️ Baxış İstiqaməti</h1>

<video id="camera" autoplay playsinline muted></video>

<div id="direction">Kameranı başlat</div>

<div id="status">
Üzünü kameraya tut
</div>

<button onclick="startCamera()">
📷 Kameranı başlat
</button>

<!-- Üz və göz tanıma sistemi -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>

const video = document.getElementById("camera");

const direction =
document.getElementById("direction");

const status =
document.getElementById("status");

let faceMesh;
let camera;

let lastDirection = "";

let lastSpeak = 0;


/* SƏS */

function speak(text) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    speechSynthesis.cancel();

    const voice =
        new SpeechSynthesisUtterance(text);

    voice.lang = "az-AZ";

    voice.rate = 0.9;

    voice.pitch = 1;

    speechSynthesis.speak(voice);
}


/* İKİ NÖQTƏ ARASINDA MƏSAFƏ */

function distance(a, b) {

    return Math.sqrt(
        Math.pow(a.x - b.x, 2) +
        Math.pow(a.y - b.y, 2)
    );

}


/* GÖZLƏRİN İSTİQAMƏTİ */

function getDirection(points) {

    /*
    MediaPipe iris nöqtələri:

    Sol iris = 468
    Sağ iris = 473

    Sol göz kənarları:
    33 - 133

    Sağ göz kənarları:
    362 - 263
    */


    if (points.length < 478) {

        return "Mərkəz";

    }


    const leftIris =
        points[468];

    const rightIris =
        points[473];


    const leftWidth =
        distance(points[33], points[133]);

    const rightWidth =
        distance(points[362], points[263]);


    /*
    İrisin göz daxilindəki mövqeyi
    */

    const leftX =
        (leftIris.x - points[33].x)
        / leftWidth;

    const rightX =
        (rightIris.x - points[362].x)
        / rightWidth;


    /*
    Yuxarı / aşağı
    */

    const leftY =
        leftIris.y -
        ((points[159].y + points[145].y) / 2);

    const rightY =
        rightIris.y -
        ((points[386].y + points[374].y) / 2);


    const x =
        ((leftX - 0.5) +
        (rightX - 0.5)) / 2;


    const y =
        (leftY + rightY) / 2;


    let horizontal = "";

    let vertical = "";


    /*
    SAĞ / SOL
    */

    if (x > 0.075) {

        horizontal = "Sol";

    }

    else if (x < -0.075) {

        horizontal = "Sağ";

    }


    /*
    YUXARI / AŞAĞI
    */

    if (y < -0.12) {

        vertical = "Yuxarı";

    }

    else if (y > 0.12) {

        vertical = "Aşağı";

    }


    /*
    DİAQONAL
    */

    if (vertical && horizontal) {

        return vertical + " " + horizontal;

    }


    if (vertical) {

        return vertical;

    }


    if (horizontal) {

        return horizontal;

    }


    return "Mərkəz";

}


/* NƏTİCƏ */

function onResults(results) {

    if (
        !results.multiFaceLandmarks ||
        results.multiFaceLandmarks.length === 0
    ) {

        direction.innerText =
            "Üz tapılmadı";

        status.innerText =
            "Üzünü kameraya tut";

        return;

    }


    const points =
        results.multiFaceLandmarks[0];


    const result =
        getDirection(points);


    direction.innerText =
        result;

    status.innerText =
        "Baxış istiqaməti izlənilir";


    const now =
        Date.now();


    /*
    Eyni istiqamətdə davamlı
    danışmağın qarşısını alırıq.
    */

    if (
        result !== "Mərkəz" &&
        (
            result !== lastDirection ||
            now - lastSpeak > 1200
        )
    ) {

        lastDirection =
            result;

        lastSpeak =
            now;

        speak(result);

    }


    if (result === "Mərkəz") {

        lastDirection = "";

    }

}


/* KAMERA */

async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices
            .getUserMedia({

                video: {

                    facingMode: "user",

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }

                },

                audio: false

            });


        video.srcObject =
            stream;


        await video.play();


        /*
        MediaPipe Face Mesh
        */

        faceMesh =
            new FaceMesh({

                locateFile:
                function(file) {

                    return
                    "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/" + file;

                }

            });


        faceMesh.setOptions({

            maxNumFaces: 1,

            refineLandmarks: true,

            minDetectionConfidence: 0.5,

            minTrackingConfidence: 0.5

        });


        faceMesh.onResults(
            onResults
        );


        /*
        Kameradan görüntünü
        Face Mesh-ə göndər
        */

        camera =
            new Camera(

                video,

                {

                    onFrame:
                    async function() {

                        await faceMesh.send({
                            image: video
                        });

                    },

                    width: 1280,

                    height: 720

                }

            );


        camera.start();


        direction.innerText =
            "Hazır";

        status.innerText =
            "Gözlərinlə istiqamətə bax";


    }

    catch (error) {

        console.error(error);

        direction.innerText =
            "Xəta";

        status.innerText =
            "Kamera açıla bilmədi";

    }

}

</script>

</body>
</html>

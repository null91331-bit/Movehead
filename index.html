<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baxış İstiqaməti</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#111;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column}
  header{padding:16px;text-align:center;font-weight:700;font-size:20px}
  #wrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}
  video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  #overlay{position:absolute;inset:0;pointer-events:none}
  .box{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:64vw;height:46vw;max-width:380px;max-height:280px;border:2px solid rgba(255,255,255,.7);border-radius:24px;box-shadow:0 0 0 9999px rgba(0,0,0,.18)}
  #panel{padding:14px 16px 18px;background:#181818}
  #direction{font-size:34px;font-weight:800;text-align:center;min-height:46px}
  #status{text-align:center;color:#bbb;margin-top:6px}
  #start{display:block;margin:12px auto 0;border:0;border-radius:14px;padding:13px 22px;font-size:17px;font-weight:700;background:#fff;color:#111}
  #start:disabled{opacity:.5}
  #hint{text-align:center;color:#999;font-size:12px;margin-top:8px}
  canvas{display:none}
</style>
</head>
<body>
<header>👁️ Baxış İstiqaməti</header>
<div id="wrap">
  <video id="video" playsinline autoplay muted></video>
  <div id="overlay"><div class="box"></div></div>
  <canvas id="canvas"></canvas>
</div>
<div id="panel">
  <div id="direction">Hazır deyil</div>
  <div id="status">“Kameranı başlat” düyməsinə bas.</div>
  <button id="start">Kameranı başlat</button>
  <div id="hint">Başını və üzünü çərçivənin içində saxla.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const startBtn = document.getElementById('start');
const directionEl = document.getElementById('direction');
const statusEl = document.getElementById('status');
const ctx = canvas.getContext('2d');

let faceMesh, camera;
let lastDirection = "";
let lastSpeakAt = 0;
let stableDirection = "";
let stableSince = 0;

function say(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'az-AZ';
  u.rate = 0.95;
  u.pitch = 1.0;
  window.speechSynthesis.speak(u);
}

function dist(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function avgPoint(points){
  return {
    x: points.reduce((s,p)=>s+p.x,0)/points.length,
    y: points.reduce((s,p)=>s+p.y,0)/points.length
  };
}

/*
  Bu HTML versiyası MediaPipe Face Mesh ilə üzü və göz konturlarını tapır.
  Başın vəziyyəti ilə yanaşı gözlərin nisbi mövqeyindən baxış istiqamətini təxmini çıxarır.
*/
function getGazeDirection(lm){
  // MediaPipe Face Mesh göz nöqtələri
  const leftEye = [33,133,159,145,160,144].map(i=>lm[i]);
  const rightEye = [362,263,386,374,387,373].map(i=>lm[i]);

  const lCenter = avgPoint(leftEye);
  const rCenter = avgPoint(rightEye);

  const lWidth = dist(lm[33], lm[133]);
  const rWidth = dist(lm[362], lm[263]);

  const lTop = avgPoint([lm[159],lm[160]]);
  const lBottom = avgPoint([lm[145],lm[144]]);
  const rTop = avgPoint([lm[386],lm[387]]);
  const rBottom = avgPoint([lm[374],lm[373]]);

  // İrisi ayrıca dəqiq ayrılmadığı üçün göz qapaqları arasında mesh nisbəti istifadə olunur.
  // Daha güclü hərəkətdə istiqaməti seçmək üçün normalizə edirik.
  const hx = ((lCenter.x - .5) + (rCenter.x - .5)) / 2;
  const vy = (((lCenter.y - .5) + (rCenter.y - .5)) / 2);

  // Üzün mərkəzini taparaq onunla müqayisə
  const nose = lm[1];
  const faceCenter = {x:nose.x, y:nose.y};

  const eyeMid = {x:(lCenter.x+rCenter.x)/2, y:(lCenter.y+rCenter.y)/2};

  // Kameraya görə nisbi dəyişmə
  const dx = (eyeMid.x - faceCenter.x);
  const dy = (eyeMid.y - faceCenter.y);

  // Təxmini baş/üz istiqaməti komponentləri
  let h="", v="";
  if(dx > 0.025) h="Sağ";
  else if(dx < -0.025) h="Sol";

  if(dy < -0.018) v="Yuxarı";
  else if(dy > 0.018) v="Aşağı";

  if(v && h) return v+" "+h;
  if(v) return v;
  if(h) return h;
  return "Mərkəz";
}

function processResults(results){
  if(!results.multiFaceLandmarks || results.multiFaceLandmarks.length===0){
    directionEl.textContent = "Üz tapılmadı";
    statusEl.textContent = "Üzünü kameraya tərəf tut.";
    stableDirection="";
    return;
  }

  const d = getGazeDirection(results.multiFaceLandmarks[0]);
  directionEl.textContent = d;
  statusEl.textContent = "İstiqamət aşkarlandı";

  const now = Date.now();
  if(d !== stableDirection){
    stableDirection=d;
    stableSince=now;
  }

  // Səhv ani titrəmələrin qarşısını almaq üçün istiqamət 180 ms sabit qalsın.
  if(d !== "Mərkəz" && now-stableSince >= 180){
    if(d !== lastDirection || now-lastSpeakAt >= 1000){
      lastDirection=d;
      lastSpeakAt=now;
      say(d);
    }
  } else if(d==="Mərkəz"){
    lastDirection="";
  }
}

async function start(){
  startBtn.disabled=true;
  statusEl.textContent="Kamera açılır...";

  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:"user",
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });
    video.srcObject=stream;
    await video.play();

    faceMesh = new FaceMesh({
      locateFile: (file) =>
        `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces:1,
      refineLandmarks:true,
      minDetectionConfidence:0.55,
      minTrackingConfidence:0.55
    });

    faceMesh.onResults(processResults);

    camera = new Camera(video,{
      onFrame: async()=>{ await faceMesh.send({image:video}); },
      width:1280,
      height:720
    });
    camera.start();

    directionEl.textContent="Hazır";
    statusEl.textContent="Üzünü çərçivəyə sal.";
  }catch(e){
    console.error(e);
    startBtn.disabled=false;
    directionEl.textContent="Xəta";
    statusEl.textContent="Kamera icazəsi verilmədi və ya brauzer bunu dəstəkləmir.";
  }
}

startBtn.addEventListener('click', ()=>{
  // Brauzer səs bloklamasını açmaq üçün istifadəçi toxunuşundan sonra səssiz sınaq.
  if('speechSynthesis' in window){
    const u=new SpeechSynthesisUtterance('');
    u.lang='az-AZ';
    window.speechSynthesis.speak(u);
  }
  start();
});
</script>
</body>
</html>
